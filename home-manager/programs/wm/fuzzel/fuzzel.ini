[main]
terminal=alacritty -e
width=40
tabs=4

[colors]
background=032935dd
text=efefefdd
message=efefefdd
prompt=586e75dd
input=efefefdd
match=cb4b16dd
selection=d2d9d5dd
selection-text=586e75dd
selection-match=cb4b16dd
border=999999dd


[border]
width=2
radius=8

[key-bindings]
cancel=Control+c Escape
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+h
cursor-right=Right Control+l
cursor-left-word=Control+Left Control+b
cursor-right-word=Control+Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-line-backward=Control+u
delete-line-forward=Control+Shift+k
delete-prev=BackSpace
delete-next=Delete
delete-prev-word=Control+w
delete-next-word=Control+d
prev=Up Control+p
next=Down Control+n
prev-with-wrap=Control+k
next-with-wrap=Control+j
first=Control+g
last=Control+Shift+g
