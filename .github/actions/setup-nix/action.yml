name: Run setup-nix
description: Set up Nix environment for GitHub Actions
inputs:
  cachix-auth-token:
    required: true
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31.10.4
    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        name: ningit
        authToken: "${{ inputs.cachix-auth-token }}"
